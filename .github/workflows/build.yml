name: Build Dashboard

on:
  push:
    branches:
      - feature/terminal-enhancement
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admin-frontend fork
        uses: actions/checkout@v4
        with:
          repository: nepko/admin-frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build-ignore-error

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/
          retention-days: 1

  build-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: apt update && apt install unzip curl -y

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: cmd/dashboard/admin-dist/

      - name: Build dashboard (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: x86_64-linux-gnu-gcc
        run: |
          go build -v -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/nezhahq/nezha/service/singleton.Version=dev" \
            -tags go_json \
            -o dist/dashboard-linux-amd64 \
            ./cmd/dashboard

      - name: Build dashboard (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: |
          go build -v -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/nezhahq/nezha/service/singleton.Version=dev" \
            -tags go_json \
            -o dist/dashboard-linux-arm64 \
            ./cmd/dashboard

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-binaries
          path: dist/dashboard-*
          retention-days: 7
